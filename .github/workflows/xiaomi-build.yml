name: Xiaomi build
on:
  push:
    branches: [xiaomi-support]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-34' 'build-tools;34.0.0' >/dev/null
      - name: Shell syntax
        run: |
          for script in build.sh install.sh check.sh undo.sh scripts/*.sh; do sh -n "$script"; done
      - name: ShellCheck install and restore
        run: shellcheck --severity=warning install.sh check.sh undo.sh scripts/*.sh
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem scripts/*.ps1,build-windows.ps1 | ForEach-Object {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$null,[ref]$parseErrors) | Out-Null
            if ($parseErrors) { throw ($parseErrors | Out-String) }
          }
      - name: Input mapping regression
        run: |
          mkdir -p out-tests
          javac -encoding UTF-8 -d out-tests src/com/ansub/tvhome/XiaomiInputs.java tests/XiaomiInputsTest.java
          java -cp out-tests dev.local.mitvhome.XiaomiInputsTest
      - name: Installer and recovery regression (mock ADB only)
        shell: pwsh
        run: ./tests/InstallerTest.ps1
      - name: Build APK
        run: sh build.sh
      - name: Verify APK
        run: |
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose out/tvhome.apk
      - uses: actions/upload-artifact@v4
        with:
          name: xiaomi-test-apk-temporary-signature
          path: out/tvhome.apk
